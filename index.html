<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Aetherfall - a job-based MMORPG</title>
  <meta name="description" content="Aetherfall: begin as a Novice, choose your path, master a job. A free browser MMORPG." />
  <meta name="theme-color" content="#0a0b10" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%224%22 fill=%22%230a0b10%22/><path d=%22M16 4 27 27h-6l-2-5H9l-2 5H2L13 4h3Zm-5 13h6l-3-7-3 7Z%22 fill=%22%23d8b451%22/></svg>" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    /* Page-level mobile annoyances are killed here, not in JS:
       - overflow:hidden + overscroll-behavior:none -> no rubber-band, no pull-to-refresh
       - touch-action:none -> no double-tap zoom, no pinch-scroll, no scroll chaining
       - -webkit-touch-callout:none + user-select:none -> no long-press callout,
         no accidental text selection while dragging the thumb stick.
       (#fatal re-enables selection below, so errors stay copyable.) */
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      overflow: hidden; overscroll-behavior: none;
      background: #0a0b10; color: #e8e6df;
      font-family: ui-monospace, "Cascadia Mono", Menlo, monospace;
      user-select: none; -webkit-user-select: none;
      touch-action: none; -webkit-touch-callout: none;
    }

    /* The play surface: the whole visible viewport, minus the notch / home
       indicator. Sized in dynamic viewport units so a collapsing mobile URL bar
       does not leave a strip, with a 100vh fallback for browsers without dvh.

       The safe area is applied by SHRINKING the box with calc() instead of
       `padding: env(...)`. Phaser measures this element's border box
       (ScaleManager.getParentBounds -> getBoundingClientRect), and padding is
       inside the border box: with padding the canvas would be sized to the full
       screen and slide under the notch. Shrinking the box makes the border box
       itself the safe area, which is what the canvas should fill. */
    #game {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: env(safe-area-inset-left, 0px);
      width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      overflow: hidden;
      background: #0a0b10;
    }

    /* The canvas must cover #game exactly at every aspect ratio (no letterbox).
       Phaser.Scale.RESIZE sizes the backing store to this same box, so this is a
       1:1 blit: displayScale === 1, nothing is resampled. `pixelated` is the
       belt-and-braces for the one case we cannot control -- the OS compositor
       scaling a 1x canvas up to a 2-3x device pixel grid -- and it is declared
       LAST so it wins over the older aliases. */
    #game canvas {
      display: block;
      width: 100%; height: 100%;
      touch-action: none;
      user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    /* Fatal overlay: a stack trace you cannot select is a bug report you cannot
       file. Selection and touch gestures stay enabled here on purpose. */
    #fatal {
      user-select: text; -webkit-user-select: text;
      touch-action: auto; -webkit-touch-callout: default;
      overscroll-behavior: contain;
    }

    #boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 38%, #16202e 0%, #0a0b10 72%);
      z-index: 10; transition: opacity .45s ease;
    }
    #boot .inner { text-align: center; padding: 0 20px; }
    #boot h1 {
      margin: 0 0 8px; font-size: clamp(22px, 7vw, 34px); letter-spacing: .34em;
      font-weight: 700; color: #d8b451; text-transform: uppercase;
      text-shadow: 0 0 22px rgba(216,180,81,.25);
    }
    #boot p { margin: 0; font-size: 10px; letter-spacing: .22em; color: #6f7b8c; text-transform: uppercase; }
    #boot .bar { margin: 22px auto 0; width: min(220px, 60vw); height: 3px; background: #1c2431; overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg,#2ad4ee,#d8b451); transition: width .2s; }
    #boot .tips { margin-top: 26px; font-size: 9px; color: #3f4a5a; letter-spacing: .1em; }
    #boot.done { opacity: 0; pointer-events: none; }
    #rotate {
      position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      font-size: 9px; letter-spacing: .16em; color: #4f5b6c;
      text-transform: uppercase; pointer-events: none; z-index: 11;
      opacity: 0; transition: opacity .4s ease;
    }
    @media (orientation: portrait) and (max-width: 820px) { #rotate { opacity: 1; } }
  </style>
  <script type="module" crossorigin src="./assets/index-Ba1mXVPH.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DN1nfrRj.css">
</head>
<body>
  <div id="game"></div>
  <div id="boot">
    <div class="inner">
      <h1>Aetherfall</h1>
      <p id="boot-status">loading</p>
      <div class="bar"><i id="boot-bar"></i></div>
      <div class="tips">begin as a novice &middot; choose your path &middot; master a job</div>
    </div>
  </div>
  <div id="rotate">rotate for a wider view</div>

  <script>
    // A silent black canvas is unacceptable: surface faults on screen.
    (function () {
      function show(msg) {
        var el = document.getElementById('fatal');
        if (!el) {
          el = document.createElement('pre');
          el.id = 'fatal';
          el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:45%;overflow:auto;'
            + 'background:#2a0d0d;color:#ff9b9b;font:11px monospace;padding:8px;margin:0;z-index:99;'
            + 'white-space:pre-wrap;border-top:1px solid #5a1d1d';
          document.body.appendChild(el);
        }
        el.textContent += msg + String.fromCharCode(10);
      }
      window.addEventListener('error', function (e) {
        show((e.message || 'error') + String.fromCharCode(10) + '  at ' + (e.filename || '?') + ':' + (e.lineno || 0) + ':' + (e.colno || 0));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('promise: ' + (r && r.message ? r.message : r));
      });

      // Touch/pointer hygiene, scoped to the play surface only. #fatal is
      // excluded everywhere so the error overlay stays selectable and scrollable.
      function inGame(target) {
        return !!(target && target.closest && target.closest('#game'));
      }
      function inFatal(target) {
        return !!(target && target.closest && target.closest('#fatal'));
      }

      // Long-press context menu belongs to the browser, except over the canvas.
      document.addEventListener('contextmenu', function (e) {
        if (inGame(e.target) && !inFatal(e.target)) e.preventDefault();
      });
      // Safari's pinch gesture events.
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      // Double-tap zoom (the meta viewport covers most of it; this covers the rest).
      document.addEventListener('dblclick', function (e) {
        if (inGame(e.target) && !inFatal(e.target)) e.preventDefault();
      });
      // Accidental text selection / iOS callout on the canvas only.
      document.addEventListener('selectstart', function (e) {
        if (inGame(e.target) && !inFatal(e.target)) e.preventDefault();
      });
      document.addEventListener('touchmove', function (e) {
        if (inGame(e.target) && !inFatal(e.target)) e.preventDefault();
      }, { passive: false });
    })();
  </script>
</body>
</html>
